name: Deploy to Quick

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: shopify-skai-train
          workload_identity_provider: "projects/503582027637/locations/global/workloadIdentityPools/github-actions-pool/providers/quick-v2"
          service_account: "quick-gha@shopify-skai-train.iam.gserviceaccount.com"
          token_format: "id_token"
          id_token_audience: "https://us-central1-shopify-skai-train.cloudfunctions.net/deploy-to-quick"

      - name: Create deployment package
        run: |
          cd "$GITHUB_WORKSPACE"
          cat > .tarignore << 'EOF'
          node_modules
          package*.json
          *.log
          *.tmp
          *.md
          LICENSE
          yarn.lock
          pnpm-lock.yaml
          bun.lockb
          AGENTS.md
          CLAUDE.md
          apps-script
          EOF
          tar -czf "/tmp/deployment.tar.gz" --exclude-from=.tarignore --exclude='./.*' .
          rm .tarignore
          echo "Package size: $(du -h /tmp/deployment.tar.gz | cut -f1)"

      - name: Deploy via Cloud Function
        run: |
          echo "Deploying shop-overview.quick.shopify.io..."
          body_file=$(mktemp)
          http_code=$(curl -s -o "$body_file" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ steps.auth.outputs.id_token }}" \
            -F "site_name=shop-overview" \
            -F "files=@/tmp/deployment.tar.gz" \
            -F "metadata={\"actor\":\"${{ github.actor }}\",\"repository\":\"${{ github.repository }}\",\"commit_sha\":\"${{ github.sha }}\"}" \
            "https://us-central1-shopify-skai-train.cloudfunctions.net/deploy-to-quick")
          body=$(cat "$body_file")
          rm -f "$body_file"
          if [[ "$http_code" -eq 200 ]]; then
            echo "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Site live at:', d.get('site_url',''))" 2>/dev/null || echo "$body"
          else
            echo "Deployment failed (HTTP $http_code)"
            echo "$body"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: rm -f /tmp/deployment.tar.gz
